<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>萌へ ♡</title><style>
:root{--ink:#68534b;--muted:#987f75;--rose:#c77d86}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 15% 15%,#fff6ef,#f5e4de 65%,#eed9d6);color:var(--ink);font-family:'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;display:grid;place-items:center}.wrap{width:min(100%,490px);padding:18px 17px 24px}.top{text-align:center;font-size:12px;letter-spacing:.22em;color:var(--muted);margin:5px 0 15px}.card{position:relative;min-height:min(70dvh,620px);background:#fffcf4;border-radius:5px;padding:42px 29px 35px;box-shadow:0 15px 40px #79534b25,0 0 0 1px #e8d5c7;overflow:hidden;touch-action:pan-y}.card:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(transparent 0 31px,#e7dcd233 32px);pointer-events:none}.card:after{content:'✿';position:absolute;right:18px;top:12px;color:#dfb6b6;font-size:24px}.tape{position:absolute;top:-9px;left:39%;height:28px;width:95px;background:#eac5bd99;transform:rotate(-5deg)}.page{position:relative;z-index:1;display:none;animation:appear .35s ease}.page.active{display:block}@keyframes appear{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:translateX(0)}}h1{text-align:center;font-size:35px;font-weight:500;margin:90px 0 24px;letter-spacing:.13em}h2{font-size:21px;font-weight:500;margin:26px 0 25px}p{font-size:16px;line-height:2.25;letter-spacing:.035em;white-space:pre-line}.sub{text-align:center;color:var(--muted);font-size:13px}.heart{text-align:center;color:var(--rose);font-size:27px;margin-top:34px}.photo{height:255px;border:10px solid white;border-bottom-width:39px;background:linear-gradient(145deg,#f5e3db,#e9d0ca);box-shadow:0 7px 20px #8e6c5a30;transform:rotate(-3deg);display:grid;place-items:center;text-align:center;color:#9e8176;font-size:14px;line-height:2}.small{text-align:center;font-size:13px;color:var(--muted)}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:17px;gap:12px}.nav button{background:#fffaf4;border:1px solid #dcbeb8;color:var(--ink);border-radius:50%;width:46px;height:46px;font-size:23px;cursor:pointer}.nav button:disabled{opacity:.3}.dots{display:flex;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#d8c5bd}.dot.on{background:#b77d82;transform:scale(1.25)}.hint{text-align:center;color:#9d837a;font-size:12px;margin-top:12px}@media(max-width:380px){.card{padding:36px 22px;min-height:69dvh}p{font-size:15px}}
</style></head><body><main class="wrap"><div class="top">a little letter for you · ♡</div><section class="card" id="card"><div class="tape"></div><article class="page active"><h1>萌へ</h1><div class="sub">いつもありがとう。</div><div class="heart">♡</div><p class="small" style="margin-top:65px">ゆっくり読んでくれたら嬉しい。</p></article><article class="page"><h2>萌へ、</h2><p>こうして手紙を書くのは、伝えたいことがたくさんあるから。\n\nこれはまだサンプルの文章だよ。ここに俺の言葉で、少しずつ手紙を綴っていきたい。</p><div class="heart">❀</div></article><article class="page"><h2>ふたりの思い出</h2><div class="photo">ここにふたりの写真を入れるよ ♡<br>PHOTO</div><p class="small" style="margin-top:35px">大切な思い出を、一枚ずつ。</p></article><article class="page"><h2>最後に、</h2><p>ここには、萌に一番伝えたい言葉を入れるね。\n\n最後まで読んでくれてありがとう。</p><div class="heart">♡</div><p class="small">これからも、よろしくね。</p></article></section><div class="nav"><button id="prev" aria-label="前のページ">‹</button><div class="dots" id="dots"></div><button id="next" aria-label="次のページ">›</button></div><div class="hint">左右にスワイプして読んでね</div></main><script>const pages=[...document.querySelectorAll('.page')],dots=document.querySelector('#dots');let n=0;pages.forEach(()=>{let d=document.createElement('span');d.className='dot';dots.append(d)});function show(i){n=Math.max(0,Math.min(i,pages.length-1));pages.forEach((p,j)=>p.classList.toggle('active',j===n));[...dots.children].forEach((d,j)=>d.classList.toggle('on',j===n));document.querySelector('#prev').disabled=n===0;document.querySelector('#next').disabled=n===pages.length-1}document.querySelector('#prev').onclick=()=>show(n-1);document.querySelector('#next').onclick=()=>show(n+1);let x=0;const c=document.querySelector('#card');c.addEventListener('touchstart',e=>x=e.changedTouches[0].screenX,{passive:true});c.addEventListener('touchend',e=>{let dx=e.changedTouches[0].screenX-x;if(Math.abs(dx)>45)show(n+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(n+1);if(e.key==='ArrowLeft')show(n-1)});show(0);</script></body></html>
