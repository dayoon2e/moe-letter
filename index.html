<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f0e8"><title>萌へ — A Letter</title><style>
:root{font-family:'Yu Mincho','Hiragino Mincho ProN',Georgia,serif;color:#54473e;background:#f6f0e8}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 14px 24px}.top{font:12px system-ui,sans-serif;letter-spacing:.18em;color:#99877a;margin-bottom:15px}.stage{width:min(100%,410px);height:min(73dvh,660px);min-height:420px;position:relative;overflow:hidden;border-radius:18px;background:#fffaf4;box-shadow:0 16px 45px #6d524522;touch-action:pan-y}.track{height:100%;display:flex;transition:transform .4s cubic-bezier(.2,.7,.2,1)}.page{flex:0 0 100%;height:100%;padding:36px 32px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative}.page:after{content:attr(data-num);position:absolute;bottom:20px;font:11px system-ui,sans-serif;color:#baa99b}.eyebrow{font:11px system-ui,sans-serif;letter-spacing:.22em;color:#b39b8d}.cover h1{font-size:39px;font-weight:400;letter-spacing:.14em;margin:24px 0}.heart{font-size:28px;color:#bd827d;margin:18px}.sub{font-size:14px;line-height:2.1;color:#9c8778}.letter{text-align:left;align-items:stretch}.letter h2{font-size:22px;font-weight:400;margin:0 0 30px;text-align:center}.letter p{font-size:15px;line-height:2.35;letter-spacing:.035em}.photo{width:100%;aspect-ratio:4/5;max-height:70%;border:1px dashed #c9b8a8;border-radius:8px;background:#f8f0e7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;color:#a68d7e}.photo span{font:13px system-ui,sans-serif}.closing h2{font-weight:400;font-size:25px;line-height:1.9}.controls{width:min(100%,410px);display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:14px}.controls button{border:1px solid #d9c8b8;border-radius:50%;width:43px;height:43px;background:#fffaf4;color:#725d50;font-size:22px;cursor:pointer}.controls button:disabled{opacity:.3}.dots{display:flex;gap:9px}.dot{width:7px;height:7px;border-radius:50%;background:#d6c8bb}.dot.active{background:#a47c70}.hint{font:12px system-ui,sans-serif;color:#a08d80;margin-top:12px}@media(max-height:620px){.stage{height:68dvh;min-height:330px}.page{padding:24px}.letter p{font-size:13px;line-height:2}}
</style></head><body><div class="top">A LITTLE LETTER FOR YOU</div><main class="stage" aria-label="手紙のページ"><div class="track" id="track"><section class="page cover" data-num="01 / 04"><div class="eyebrow">FOR SOMEONE SPECIAL</div><div class="heart">♡</div><h1>萌へ</h1><div class="sub">伝えたいことが、あるんだ。<br>ゆっくり読んでくれたら嬉しい。</div></section><section class="page letter" data-num="02 / 04"><h2>萌へ</h2><p>いつもありがとう。</p><p>こうして手紙を書くのは、普段の会話だけでは伝えきれない気持ちがあるから。</p><p>これから、このページに俺の言葉を少しずつ綴っていきたいと思う。</p><p style="color:#ae9183;font-size:12px">※ これは仮の文章です。あとで自由に変更できます。</p></section><section class="page" data-num="03 / 04"><div class="eyebrow" style="margin-bottom:22px">OUR MEMORIES</div><div class="photo"><div style="font-size:38px">♡</div><span>ここに二人の写真を入れる</span></div><p class="sub">一緒に過ごした時間</p></section><section class="page closing" data-num="04 / 04"><div class="eyebrow">TO BE CONTINUED...</div><div class="heart" style="font-size:48px">♡</div><h2>これからも、<br>よろしくね。</h2><p class="sub">心を込めて、俺より</p></section></div></main><nav class="controls" aria-label="ページ移動"><button id="prev" aria-label="前のページ">‹</button><div class="dots" id="dots"></div><button id="next" aria-label="次のページ">›</button></nav><div class="hint">左右にスワイプして読んでね ↔</div><script>
const track=document.getElementById('track'),dots=document.getElementById('dots'),prev=document.getElementById('prev'),next=document.getElementById('next');let page=0;const total=4;for(let i=0;i<total;i++){let d=document.createElement('span');d.className='dot';dots.appendChild(d)}function go(n){page=Math.max(0,Math.min(total-1,n));track.style.transform=`translateX(-${page*100}%)`;[...dots.children].forEach((d,i)=>d.classList.toggle('active',i===page));prev.disabled=page===0;next.disabled=page===total-1}prev.onclick=()=>go(page-1);next.onclick=()=>go(page+1);let startX=0,startY=0;const stage=document.querySelector('.stage');stage.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;startY=e.touches[0].clientY},{passive:true});stage.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-startX,dy=e.changedTouches[0].clientY-startY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)go(page+(dx<0?1:-1))},{passive:true});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(page+1);if(e.key==='ArrowLeft')go(page-1)});go(0);
</script></body></html>
